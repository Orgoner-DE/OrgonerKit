name: Build Orgoner App Studio APK
on:
  push:
    branches: [app-studio-apk-build-20261112]
    paths:
      - 'apps/orgoner-app-studio/**'
      - '.github/workflows/build-appstudio-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon -p apps/orgoner-app-studio :app:assembleDebug
      - name: Verify artifact
        run: |
          test -s apps/orgoner-app-studio/app/build/outputs/apk/debug/app-debug.apk
          unzip -t apps/orgoner-app-studio/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum apps/orgoner-app-studio/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Orgoner-App-Studio-v1.0.0-debug-apk
          path: apps/orgoner-app-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
