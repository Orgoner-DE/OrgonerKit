name: Build VoiceVocoder APK
on:
  push:
    branches: [voicevocoder-build-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          base64 -d build/voicevocoder-project.b64 > project.zip
          unzip project.zip
      - run: gradle --no-daemon -p VoiceVocoderLive :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceVocoderLive-APK
          path: VoiceVocoderLive/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
